[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "model-based-rl"
version = "0.1.0"
description = "Model-Based Reinforcement Learning for CERN AWAKE Electron Beam Trajectory Steering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
authors = [
    {name = "Simon Hirlaender", email = "simon.hirlaender@cern.ch"},
]
keywords = ["reinforcement-learning", "model-based", "accelerator-control", "AWAKE", "CERN"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "tensorflow>=1.14,<2.0",
    "numpy",
    "gym",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "bayesian-optimization",
]

[project.urls]
Homepage = "https://github.com/MathPhysSim/MODEL-BASED-RL"
Repository = "https://github.com/MathPhysSim/MODEL-BASED-RL"
